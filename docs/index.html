<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Anzu Engine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #323094;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #a00707;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>

    <script type="module">
      // Bootstrap wasm module (expects `pkg/` generated by wasm-bindgen or wasm-pack)
      import init from './pkg/anzu_engine.js';

      function setupCanvasFocus() {
        const canvas = document.getElementById('canvas');
        if (!canvas) {
          return;
        }

        const focusCanvas = () => {
          if (document.hasFocus()) {
            return;
          }
          try {
            window.focus();
          } catch (_) {
            // Browser may block programmatic focus; canvas focus still helps.
          }
          canvas.focus({ preventScroll: true });
        };

        // Re-acquire focus when user interacts with the page.
        // window.addEventListener('pointerdown', focusCanvas, { passive: true });
        // window.addEventListener('keydown', focusCanvas);
        // window.addEventListener('touchstart', focusCanvas, { passive: true });

        focusCanvas();
      }

      async function run() {
        setupCanvasFocus();
        await init({ module_or_path: './pkg/anzu_engine_bg.wasm' });
        console.log('WASM Loaded');
      }

      run();
    </script>
  </body>
</html>
