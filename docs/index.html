<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Anzu Engine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      #diag {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2f2f2f;
        background: rgba(0, 0, 0, 0.72);
        color: #d9d9d9;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        min-width: 280px;
        white-space: pre-line;
      }

      #diag .bad {
        color: #ff8a80;
      }

      #diag .ok {
        color: #9ccc65;
      }

      #hud-controls {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1001;
        display: flex;
        gap: 8px;
      }

      .anzu-button {
        border: 1px solid #3a3a3a;
        background: rgba(8, 8, 8, 0.8);
        color: #f2f2f2;
        border-radius: 8px;
        padding: 8px 10px;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        cursor: pointer;
      }

      .anzu-button:hover {
        background: rgba(28, 28, 28, 0.9);
      }

      #game-over-panel {
        position: fixed;
        inset: 0;
        z-index: 1002;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }

      #game-over-card {
        border: 1px solid #4a4a4a;
        background: rgba(10, 10, 10, 0.9);
        border-radius: 12px;
        padding: 18px;
        width: min(320px, calc(100vw - 32px));
        color: #f1f1f1;
        text-align: center;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #game-over-card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      #game-over-card p {
        margin: 0 0 14px;
        color: #c7c7c7;
      }
    </style>
  </head>
  <body>
    <canvas id="anzu-canvas" width="800" height="600" tabindex="0"></canvas>
    <div id="diag" aria-live="polite"></div>
    <div id="hud-controls">
      <button id="toggle-diag" class="anzu-button" type="button">Hide Input HUD</button>
    </div>
    <div id="game-over-panel" aria-live="polite" aria-hidden="true">
      <div id="game-over-card">
        <h2>Game Over</h2>
        <p>You can restart instantly without refreshing.</p>
        <button id="reset-game" class="anzu-button" type="button">Reset</button>
      </div>
    </div>

    <script type="module">
      // Bootstrap wasm module (expects `pkg/` generated by wasm-bindgen or wasm-pack)
      import init, { is_game_over, reset_game } from './pkg/anzu_engine.js';

      let hudVisible = true;
      let wasmReady = false;
      let gameOverVisible = false;

      function setHudVisible(visible) {
        const hud = document.getElementById('diag');
        const toggleButton = document.getElementById('toggle-diag');
        if (!hud || !toggleButton) {
          return;
        }

        hudVisible = visible;
        hud.style.display = visible ? 'block' : 'none';
        toggleButton.textContent = visible ? 'Hide Input HUD' : 'Show Input HUD';
      }

      function setGameOverVisible(visible) {
        const panel = document.getElementById('game-over-panel');
        if (!panel) {
          return;
        }

        gameOverVisible = visible;
        panel.style.display = visible ? 'flex' : 'none';
        panel.setAttribute('aria-hidden', visible ? 'false' : 'true');
      }

      function setupUiControls() {
        const toggleButton = document.getElementById('toggle-diag');
        const resetButton = document.getElementById('reset-game');

        if (toggleButton) {
          toggleButton.addEventListener('click', (event) => {
            event.stopPropagation();
            setHudVisible(!hudVisible);
          });
        }

        if (resetButton) {
          resetButton.addEventListener('click', (event) => {
            event.stopPropagation();
            if (!wasmReady) {
              return;
            }

            reset_game();
            setGameOverVisible(false);
          });
        }

        setHudVisible(true);
        setGameOverVisible(false);
      }

      function startGameOverSyncLoop() {
        setInterval(() => {
          if (!wasmReady) {
            return;
          }

          const over = is_game_over();
          if (over !== gameOverVisible) {
            setGameOverVisible(over);
          }
        }, 100);
      }

      function updateDiagnosticsHud(lastEvent = 'none') {
        const hud = document.getElementById('diag');
        if (!hud || !hudVisible) {
          return;
        }

        const gamepads =
          typeof navigator.getGamepads === 'function' ? navigator.getGamepads() : [];
        const slotCount = gamepads.length;
        let visibleGamepads = 0;

        for (const pad of gamepads) {
          if (pad) {
            visibleGamepads += 1;
          }
        }

        const hasFocus = document.hasFocus();
        const visibility = document.visibilityState;
        const secureContext = window.isSecureContext;
        const policyAllowsGamepad = (() => {
          try {
            if (document.permissionsPolicy?.allowsFeature) {
              return document.permissionsPolicy.allowsFeature('gamepad');
            }
            if (document.featurePolicy?.allowsFeature) {
              return document.featurePolicy.allowsFeature('gamepad');
            }
          } catch (_) {
            return 'error';
          }
          return 'unknown';
        })();
        const topLevel = (() => {
          try {
            return window.top === window;
          } catch (_) {
            return false;
          }
        })();
        const ua = navigator.userAgent;

        hud.innerHTML = [
          '<strong>Input Diagnostics</strong>',
          `focus: <span class="${hasFocus ? 'ok' : 'bad'}">${hasFocus}</span>`,
          `visibility: <span class="${visibility === 'visible' ? 'ok' : 'bad'}">${visibility}</span>`,
          `gamepad API: <span class="${typeof navigator.getGamepads === 'function' ? 'ok' : 'bad'}">${typeof navigator.getGamepads === 'function'}</span>`,
          `secure context: <span class="${secureContext ? 'ok' : 'bad'}">${secureContext}</span>`,
          `policy gamepad: <span class="${policyAllowsGamepad === true ? 'ok' : policyAllowsGamepad === false ? 'bad' : ''}">${policyAllowsGamepad}</span>`,
          `top level: <span class="${topLevel ? 'ok' : 'bad'}">${topLevel}</span>`,
          `slots: ${slotCount}`,
          `visible gamepads: <span class="${visibleGamepads > 0 ? 'ok' : 'bad'}">${visibleGamepads}</span>`,
          `ua: ${ua}`,
          `last event: ${lastEvent}`,
          'tip: click canvas, then press a gamepad button',
        ].join('\n');
      }

      function setupFocusAndGamepadDiagnostics() {
        const canvas = document.getElementById('anzu-canvas');
        if (!canvas) {
          console.warn('[INPUT][FOCUS] canvas not found');
          return;
        }

        const focusCanvas = () => {
          if (document.hasFocus()) {
            return;
          }
          try {
            window.focus();
          } catch (_) {
            // Browser may block programmatic focus; canvas focus still helps.
          }
          canvas.focus({ preventScroll: true });
        };

        // Re-acquire focus when user interacts with the page.
        window.addEventListener('pointerdown', focusCanvas, { passive: true });
        window.addEventListener('keydown', focusCanvas);
        window.addEventListener('touchstart', focusCanvas, { passive: true });

        window.addEventListener('focus', () => {
          console.log('[INPUT][FOCUS] window focused');
          updateDiagnosticsHud('window:focus');
        });
        window.addEventListener('blur', () => {
          console.warn('[INPUT][FOCUS] window blurred');
          updateDiagnosticsHud('window:blur');
        });
        document.addEventListener('visibilitychange', () => {
          console.log(`[INPUT][FOCUS] visibility changed: ${document.visibilityState}`);
          updateDiagnosticsHud(`visibility:${document.visibilityState}`);
        });
        window.addEventListener('gamepadconnected', (event) => {
          const pad = event.gamepad;
          console.log(
            `[INPUT][GAMEPAD] browser event connected index=${pad.index} id='${pad.id}' buttons=${pad.buttons?.length ?? 0} axes=${pad.axes?.length ?? 0}`
          );
          updateDiagnosticsHud(`gamepadconnected:${pad.index}`);
        });
        window.addEventListener('gamepaddisconnected', (event) => {
          const pad = event.gamepad;
          console.warn(
            `[INPUT][GAMEPAD] browser event disconnected index=${pad.index} id='${pad.id}'`
          );
          updateDiagnosticsHud(`gamepaddisconnected:${pad.index}`);
        });

        setInterval(() => {
          updateDiagnosticsHud('poll');
        }, 500);

        focusCanvas();
        updateDiagnosticsHud('startup');
      }

      async function run() {
        setupUiControls();
        startGameOverSyncLoop();
        setupFocusAndGamepadDiagnostics();
        await init({ module_or_path: './pkg/anzu_engine_bg.wasm' });
        wasmReady = true;
        console.log('WASM Loaded');
      }

      run();
    </script>
  </body>
</html>
