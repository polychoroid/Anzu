<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Anzu Engine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="anzu-canvas" width="800" height="600"></canvas>

    <script type="module">
      // Bootstrap wasm module (expects `pkg/` generated by wasm-bindgen or wasm-pack)
      import init from './pkg/anzu_engine.js';

      async function run() {
        await init({ module_or_path: './pkg/anzu_engine_bg.wasm' });
        console.log('WASM Loaded');
      }

      run();
    </script>
  </body>
</html>
