[package]
name = "anzu-engine"
version = "0.1.0"
edition = "2021"
description = "Anzu simulation engine"
repository = "https://github.com/polychoroid/Anzu"
license = "MIT"

[dependencies]
cfg-if = "1"
# Browser-first WebGPU (native WebGPU in supported browsers)
wgpu = "29"
winit = "0.30"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
    "console",
    "Navigator",
    "Gamepad",
    "GamepadButton",
    "Request",
    "Response",
    "WebSocket",
    "Performance",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1.7"
tracing = "0.1.41"
futures = "0.3.31"
bytemuck = { version = "1.17", features = ["derive"] }

[lib]
crate-type = ["cdylib"]

[features]
# No default features to keep the build minimal. Add optional features later as needed.
default = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser WebGPU with WebGL fallback when WebGPU is unavailable in the browser.
wgpu = { version = "29", features = ["webgl"] }
