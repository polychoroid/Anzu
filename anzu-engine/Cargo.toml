[package]
name = "anzu-engine"
version = "0.1.0"
edition = "2024"
description = "Anzu simulation engine"
repository = "https://github.com/polychoroid/Anzu"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
winit = { version = "0.30.13", features = ["android-native-activity"]}
env_logger = "0.11.11"
log = "0.4.33"
wgpu = "30.0.0"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
nalgebra = { version = "0.35.0", features = ["bytemuck"] }

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["png", "jpeg"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
web-time = "1.1.0"
wgpu = { version = "30.0", features = ['webgl']}
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.104", features = [
    "Document",
    "Window",
    "Element",
]}
